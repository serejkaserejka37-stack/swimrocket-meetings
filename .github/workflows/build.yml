name: Build SwimRocket Meetings

permissions:
  contents: write

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-local.txt pyinstaller pillow
      - name: Build brand assets
        run: python resources/build_swimrocket_assets.py
      - name: Build Windows app
        run: |
          python -m PyInstaller --noconfirm --clean --windowed `
            --name SwimRocketMeetings `
            --icon resources/swimrocket.ico `
            --add-data "resources;resources" `
            --exclude-module torch `
            --exclude-module faster_whisper `
            --exclude-module pyannote `
            --exclude-module transformers `
            main.py
      - name: Build installer
        run: |
          choco install innosetup --no-progress -y
          iscc packaging/windows_installer.iss
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: SwimRocket-Windows
          path: |
            release/SwimRocketMeetings-Setup.exe
            docs/*Windows.pdf

  macos:
    strategy:
      matrix:
        include:
          - os: macos-15
            suffix: AppleSilicon
          - os: macos-15-intel
            suffix: Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python3 -m pip install -r requirements-mac.txt pyinstaller pillow
      - name: Check macOS imports
        run: python3 -c "from app.main_window import MainWindow; from app.recording.mac_audio_capture import MacDualAudioCapture; print('macOS import OK')"
      - name: Build macOS app and DMG
        run: bash packaging/build_macos.sh
      - name: Name installer by architecture
        run: mv release/SwimRocketMeetings.dmg release/SwimRocketMeetings-${{ matrix.suffix }}.dmg
      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: SwimRocket-macOS-${{ matrix.os }}
          path: |
            release/SwimRocketMeetings-${{ matrix.suffix }}.dmg
            docs/*macOS.pdf

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/**/*.exe
            release-assets/**/*.dmg
            release-assets/**/*.pdf
          generate_release_notes: true
